#++
#   DESCRIPTION: The .deb packages of MSCPHUB (amd64, arm64) for a GitHub Release
#
#   AUTHOR: Ruslan R. Laishev (BMF, The BadAss SysMan)
#
#   CREATION DATE: 03-NOV-2026
#
#	A push of the tag X.01-NN[ECOnn] builds the packages, runs the regression tests of
#	both architectures and attaches the packages, the manuals (PDF) and the sources tarball
#	to the Release of that tag.  The manual run (Actions -> release -> Run workflow) with
#	the <tag> input does the same for an existing tag (the files of its Release are
#	replaced); without it - only builds and tests the branch, see the run's artifacts.
#
#	Built on Debian 12 (bookworm): the binary needs glibc >= 2.34 and liburing >= 2.3
#	(bookworm, trixie, Ubuntu 24.04 and newer).  StarLet and HELP are linked statically.
#	Every package is installed on bookworm, trixie and noble before the release.
#
#	MODIFICATION HISTORY:
#
#	03-NOV-2026	RRL	Initial version.
#
#	03-NOV-2026	RRL	The container runs with seccomp=unconfined (io_uring); a failed ctest is
#			reported as annotations.
#
#	10-NOV-2026	CLD	SHA256SUMS is signed with minisign (secret MINISIGN_KEY, no secret - the
#			job fails), checked with minisign.pub of the tree; SHA256SUMS.minisig is
#			attached to the Release.
#
#	11-NOV-2026	CLD	The signature is checked with the public key written in the
#			workflow, not minisign.pub of the tree: a re-run of a tag older than
#			minisign.pub has no such file.
#
#	12-NOV-2026	CLD	The tag is the IDENT itself, X.01-24ECO03 (was vX01-24ECO2): tags
#			X.* start the workflow; the old vX* tags can still be run by hand.
#
#	12-NOV-2026	CLD	StarLet and HELP are pinned commits of GitHub (STARLET_REF 7e910f8 = 1.7.2,
#			VHELP_REF e7f90c4 = HELP X01-38), not HEAD; StarLet from GitHub, its main
#			repository, not GitLab.
#
#	12-NOV-2026	CLD	A tag X.* must be X.aa-bb[ECOcc] with two digits in every field
#			(X.01-24ECO3 is refused); the old vX* tags as they are.
#
#	12-NOV-2026	CLD	VHELP_REF 9f89cd6 = HELP X.01-38ECO01 (was e7f90c4, X01-38).
#--

name: release

on:
  push:
    tags: ['X.*']
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag (X.01-24ECO03) to build and release; empty - build only"
        required: false
        default: ""

permissions:
  contents: write

env:
  #	The pinned commits of StarLet and HELP - moved by hand, after a check
  STARLET_REPO: "https://github.com/SysMan-One/utility_routines.git"
  STARLET_REF: "7e910f809db2932c0a39904280322eb1eedef9d8"     # StarLet 1.7.2
  HELP_REPO: "https://github.com/SysMan-One/vHELP.git"
  VHELP_REF: "9f89cd6277a4d785978aa8e9202d4782e7dce5e5"        # HELP X.01-38ECO01

jobs:
  deb:
    name: build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:bookworm
      options: --init --security-opt seccomp=unconfined      # --init: PID 1 reaps the stopped daemons (the test of init.sh)
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential cmake pkg-config \
            liburing-dev dpkg-dev file git ca-certificates

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build and install StarLet and HELP
        run: |
          fetch () {      # $1 - the directory, $2 - the repository, $3 - the pinned commit
            git init -q "$1" && git -C "$1" fetch -q --depth 1 "$2" "$3" && git -C "$1" checkout -q FETCH_HEAD
          }
          fetch /tmp/starlet "$STARLET_REPO" "$STARLET_REF"
          git -C /tmp/starlet log -1 --format='StarLet: %H %cd'
          cmake -S /tmp/starlet -B /tmp/starlet/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/starlet/build -j "$(nproc)"
          cmake --install /tmp/starlet/build
          fetch /tmp/help "$HELP_REPO" "$VHELP_REF"
          git -C /tmp/help log -1 --format='HELP: %H %cd'
          cmake -S /tmp/help -B /tmp/help/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/help/build -j "$(nproc)"
          cmake --install /tmp/help/build

      - name: Build, test, package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMH_SYSTEMD=ON
          cmake --build build -j "$(nproc)"
          cd build
          ctest --output-on-failure --output-log ctest.log || {
            rc=$?
            # an annotation is visible without a token: the names and the tail of the failed tests
            for t in $(sed 's/^[0-9]*://' Testing/Temporary/LastTestsFailed.log); do echo "::error::ctest FAILED: $t"; done
            echo "::error::$(grep -v '^ *$' ctest.log | tail -n 25 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit $rc
          }
          cd ..
          (cd build && cpack -G DEB)

      - name: Check the package
        run: |
          deb=$(ls build/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          case "$deb" in *_${{ matrix.arch }}.deb) ;; *) echo "Wrong architecture: $deb"; exit 1;; esac
          dpkg-deb --contents "$deb" | grep -q 'share/help/mscphub.hlb'

      - uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.arch }}
          path: build/*.deb
          if-no-files-found: error

  test:
    name: install ${{ matrix.arch }} on ${{ matrix.distro }}
    needs: deb
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro: ['debian:bookworm', 'debian:trixie', 'ubuntu:noble']
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.distro }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: deb-${{ matrix.arch }}

      - name: Install the package
        run: |
          apt-get update
          apt-get install --yes ./*.deb
          test -x /opt/mscphub/sbin/mscphub
          test -x /opt/mscphub/sbin/mhmon
          test -f /lib/systemd/system/mscphub.service
          test -f /etc/mscphub/mscphub.conf.example

      - name: Start the program
        run: |
          /opt/mscphub/sbin/mscphub /HELP | head -n 5
          ldd /opt/mscphub/sbin/mscphub
          dpkg --remove mscphub
          test ! -e /opt/mscphub/sbin/mscphub

  release:
    name: GitHub Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/X.') || startsWith(inputs.tag, 'X.') || startsWith(inputs.tag, 'vX')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: src

      - uses: actions/download-artifact@v7
        with:
          pattern: 'deb-*'
          merge-multiple: true

      - name: Make the files of the Release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ident=$(sed -n 's/^#define[[:space:]]*__IDENT__[[:space:]]*"\(.*\)"/\1/p' src/src/mscphub.c)
          rev=$(sed -n 's/^#define[[:space:]]*__REV__[[:space:]]*"\(.*\)"/\1/p' src/src/mscphub.c)
          test -n "$ident" && test -n "$rev"
          # The tag is the IDENT (X.01-24ECO03); the releases up to X01-24ECO2 had a "v" before it
          # A tag X.* is X.aa-bb[ECOcc] with two digits each (X.01-24ECO3 is refused); the older vX* as they are
          case "$TAG" in X.*) [[ "$TAG" =~ ^X\.[0-9]{2}-[0-9]{2}(ECO[0-9]{2})?$ ]] || { echo "$TAG is not X.aa-bb[ECOcc]"; exit 1; };; esac
          test "$TAG" = "$ident" || test "$TAG" = "v$ident" || { echo "$TAG is not $ident"; exit 1; }
          for pkg in *.deb; do        # The package version is __REV__ of the head module
            case "$pkg" in mscphub_${rev}-*) ;; *) echo "$pkg does not match $rev"; exit 1;; esac
          done
          for f in users_guide users_guide_ru programmers_guide programmers_guide_ru; do
            cp "src/doc/mscphub_$f.pdf" "MSCPHUB-$ident-$f.pdf"
          done
          git -C src archive --format=tar.gz --prefix="MSCPHUB-$ident/" \
            -o "$PWD/MSCPHUB-$ident.tar.gz" HEAD
          ls -l *.deb *.pdf *.tar.gz
          sha256sum *.deb *.tar.gz > SHA256SUMS
          echo "ident=$ident" >> "$GITHUB_ENV"
          echo "rev=$rev" >> "$GITHUB_ENV"

      #	The secret MINISIGN_KEY is the secret key of minisign.pub, whole text
      #	(no password); it lives in the runner's temporary directory for this
      #	step only.  The signature is checked with the public key written below
      #	(the one of minisign.pub; an older tag has no minisign.pub) before
      #	anything is published.
      - name: Sign SHA256SUMS
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "${MINISIGN_KEY}" ]
          then
            echo "::error::no MINISIGN_KEY secret - the release would go out unsigned"
            exit 1
          fi
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          key="${RUNNER_TEMP}/minisign.key"
          trap 'rm -f "${key}"' EXIT
          ( umask 077; printf '%s\n' "${MINISIGN_KEY}" > "${key}" )
          minisign -S -s "${key}" -m SHA256SUMS \
            -t "MSCPHUB ${TAG} SHA256SUMS signed $(date -u +%d-%b-%Y | tr a-z A-Z)"
          # The key is pinned here, not read from src/: a re-run of an older tag has no minisign.pub.
          minisign -Vm SHA256SUMS -P RWQl4NAqFsHKkNoHkS52WSZSk+2kb+e58DWYpoi/jVFa6TqOTAm3Ph14

      - name: Attach the packages to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" *.deb *.pdf *.tar.gz SHA256SUMS SHA256SUMS.minisig --clobber
          else
            gh release create "$TAG" *.deb *.pdf *.tar.gz SHA256SUMS SHA256SUMS.minisig --title "MSCPHUB $ident" --notes-file - <<EOF
          MSCP disk server for OpenVMS nodes, over NISCA. The .deb for amd64 and arm64 is installed on Debian 12, Debian 13 and Ubuntu 24.04 (glibc >= 2.34 and liburing >= 2.3). Install: \`sudo apt install ./mscphub_${rev}-1_<arch>.deb\`. The files are in /opt/mscphub, the sample of the parameter file in /etc/mscphub; the systemd units are installed, never enabled.

          To check a download (the .deb packages and the sources tarball; the PDF manuals are not in SHA256SUMS): \`minisign -Vm SHA256SUMS -P RWQl4NAqFsHKkNoHkS52WSZSk+2kb+e58DWYpoi/jVFa6TqOTAm3Ph14\` (\`SHA256SUMS.minisig\` next to it), then \`sha256sum -c --ignore-missing SHA256SUMS\`.
          EOF
          fi
